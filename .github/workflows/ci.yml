name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bodas
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/bodas
      JWT_SECRET: ci-secret-for-tests-only-at-least-32-characters
      INVITATION_TOKEN_SECRET: ci-invitation-secret-at-least-32-characters
      WEB_ORIGIN: http://localhost:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run prisma:generate -w @bodas/api
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - run: npm run build
      - run: npm run test:e2e -w @bodas/api
